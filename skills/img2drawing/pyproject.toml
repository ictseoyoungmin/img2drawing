[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2drawing"
dynamic = ["version"]
description = "Observation-first, stage-free agent drawing runtime with explicit strokes and residual inspection"
authors = [{name = "ictseoyoungmin"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "img2drawing._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["img2drawing*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
"img2drawing.data" = ["*.json"]
