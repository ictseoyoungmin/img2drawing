name: img2drawing-publish-release

on:
  workflow_run:
    workflows: ["img2drawing-vnext-rc"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install release build tooling
        run: python -m pip install build

      - name: Publish pending release manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(dev/release/publish/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No release manifests found."
            exit 0
          fi

          for manifest in "${manifests[@]}"; do
            tag="$(jq -r '.tag' "$manifest")"
            title="$(jq -r '.title' "$manifest")"
            notes="$(jq -r '.notes_file' "$manifest")"
            package_dir="$(jq -r '.package_dir' "$manifest")"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping."
              continue
            fi

            version_file="$package_dir/src/img2drawing/_version.py"
            version="$(python -c 'import runpy, sys; print(runpy.run_path(sys.argv[1])["__version__"])' "$version_file")"
            if [ "$tag" != "v$version" ]; then
              echo "Manifest tag $tag does not match package version $version" >&2
              exit 1
            fi

            rm -rf dist
            python -m build --outdir "$PWD/dist" "$package_dir"

            assets=(dist/*)
            while IFS= read -r asset; do
              [ -n "$asset" ] && assets+=("$asset")
            done < <(jq -r '.assets[]?' "$manifest")

            for asset in "${assets[@]}"; do
              test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
            done

            gh release create "$tag" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              "${assets[@]}"
          done
