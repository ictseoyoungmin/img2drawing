name: img2drawing-r23

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime and test dependencies
        run: python -m pip install -e 'skills/img2drawing[dev]'
      - name: Verify vNext control-plane invariants
        run: |
          python dev/planning/vnext/verify_baseline.py
          python dev/tools/verify_repository_paths.py --json --python
      - name: Run tests without ambient plugin influence
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q dev/tests
      - name: Verify material and fresh-worker evidence
        run: |
          python dev/tools/verify_bottleneck_completion.py --check s10
          python dev/tools/verify_bottleneck_completion.py --check s11-s12
          python dev/tools/verify_bottleneck_completion.py --check s14
      - name: Verify release identity and artifact hashes
        run: |
          python dev/release/validate_r23_release.py
          python dev/tools/verify_bottleneck_completion.py --check s15
