name: img2drawing-ci

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime and test dependencies
        run: python -m pip install -e 'skills/img2drawing[dev]'
      - name: Verify repository and package invariants
        run: |
          python dev/planning/vnext/verify_baseline.py
          python dev/tools/verify_repository_paths.py --json --python
      - name: Verify current documentation consistency
        run: python dev/tools/verify_current_documentation.py
      - name: Verify current runtime surface
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            dev/tests/test_runtime_physical_isolation.py \
            dev/tests/test_fast_timelapse_release_contract.py
      - name: Verify skill instruction graph reachability
        run: python dev/tools/verify_instruction_graph.py
      - name: Verify v1.0.3 RC promotion evidence
        run: python dev/tools/verify_v103_rc_promotion.py
      - name: Run active test suite without ambient plugin influence
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q dev/tests
      - name: Verify frozen historical evidence
        run: |
          python dev/tools/verify_vnext_b09.py closure
          python dev/tools/verify_bottleneck_completion.py --check s10
          python dev/tools/verify_bottleneck_completion.py --check s11-s12
          python dev/tools/verify_bottleneck_completion.py --check s14
      - name: Verify package, installed API, instruction graph, and supply-chain boundary
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python dev/tools/verify_vnext_b17.py
      - name: Verify frozen v1.0.2 release history
        run: python dev/tools/verify_vnext_b18.py
      - name: Build verified RC wheel artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/1.0.3-rc'
        run: python -m build --wheel --outdir dist skills/img2drawing
      - name: Upload verified RC wheel artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/1.0.3-rc'
        uses: actions/upload-artifact@v4
        with:
          name: img2drawing-1.0.3-rc-candidate-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
